[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp"
version = "0.1.0"
description = "AI-Assisted Architecture Design Platform — canonical data model and schema generator"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework (ADP-SPEC-003) ──────────────────────────────────────────
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",                  # FastAPI dependency; pin for stability
    "click>=8.0",                       # CLI entry points (adp-import-calm etc.)
    # ── Data layer ────────────────────────────────────────────────────────────
    "pydantic==2.13.2",
    "jsonschema==4.10.3",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.13.1",
    "pydantic-settings==2.14.2",
    "pgvector>=0.3",
    # ── AI / ML ───────────────────────────────────────────────────────────────
    "sentence-transformers>=2.7",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "tiktoken>=0.7",
    # ── Knowledge connectors ──────────────────────────────────────────────────
    "gitpython>=3.1",
    "python-frontmatter>=1.1",
    # ── Rendering ─────────────────────────────────────────────────────────────
    "cairosvg>=2.7",
    # ── Observability ─────────────────────────────────────────────────────────
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.17",
    # ── Utilities ─────────────────────────────────────────────────────────────
    "pyyaml>=6.0",
    # ── Authentication (ADP-SPEC-026) ─────────────────────────────────────────
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "testcontainers[postgres]>=4.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[project.scripts]
adp-generate = "adp.generate:main"
adp-reindex = "adp.knowledge.indexer:main"
adp-import-calm = "adp.calm.importer:cli"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Non-strict mode — catch the most common bugs without fighting third-party stubs
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["numpy.*", "sentence_transformers.*", "langgraph.*", "langchain_core.*", "cairosvg.*", "jose.*", "pgvector.*", "prometheus_client.*", "tiktoken.*", "gitpython.*", "frontmatter.*", "sqlalchemy.*", "asyncpg.*", "alembic.*", "click.*"]
ignore_errors = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=adp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["adp"]
branch = true
omit = [
    "src/adp/store/migrations/*",          # Alembic DDL — verified by integration tests
    "src/adp/store/store.py",              # DB-layer — requires Docker
    "src/adp/knowledge/retrieval.py",      # DB-layer — requires Docker/pgvector
    "src/adp/knowledge/indexer.py",        # DB-layer + CLI runner — requires Docker
    "src/adp/knowledge/index.py",          # DB-layer ORM — requires Docker
    "src/adp/knowledge/connectors/design_store.py",  # Requires running DesignStore
    "src/adp/api/deps.py",                 # DB/auth infrastructure — always mocked in tests
    "src/adp/llm/client.py",              # HTTP client — always mocked in tests
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "^\\.\\.\\.\\s*$",
]
