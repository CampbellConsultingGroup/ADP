[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp"
version = "0.1.0"
description = "AI-Assisted Architecture Design Platform — canonical data model and schema generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.2",
    "jsonschema==4.10.3",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.13.1",
    "pydantic-settings==2.14.2",
    "pgvector>=0.3",
    "sentence-transformers>=2.7",
    "gitpython>=3.1",
    "python-frontmatter>=1.1",
    "opentelemetry-sdk>=1.25",
    "tiktoken>=0.7",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "cairosvg>=2.7",
    "pyyaml>=6.0",
    "prometheus-client>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "testcontainers[postgres]>=4.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[project.scripts]
adp-generate = "adp.generate:main"
adp-reindex = "adp.knowledge.indexer:main"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=adp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["adp"]
branch = true
omit = [
    "src/adp/store/migrations/*",          # Alembic DDL — verified by integration tests
    "src/adp/store/store.py",              # DB-layer — requires Docker
    "src/adp/knowledge/retrieval.py",      # DB-layer — requires Docker/pgvector
    "src/adp/knowledge/indexer.py",        # DB-layer + CLI runner — requires Docker
    "src/adp/knowledge/index.py",          # DB-layer ORM — requires Docker
    "src/adp/knowledge/connectors/design_store.py",  # Requires running DesignStore
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
