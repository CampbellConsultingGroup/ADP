name: ADP Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: QG-02 — Schema drift gate
        run: adp-generate --check

      - name: QG-04 / QG-05 — Tests and coverage
        run: python3 -m pytest --cov=adp --cov-report=term-missing --cov-fail-under=85

      - name: QG-06 — Linting (ruff)
        run: ruff check src/ tests/

      - name: QG-06 — Type checking (mypy)
        run: mypy src/adp/

      - name: QG-06 — Security scan (bandit)
        run: bandit -r src/adp/ -ll

      - name: QG-07 — Dependency CVE scan (pip-audit)
        run: pip-audit --strict
