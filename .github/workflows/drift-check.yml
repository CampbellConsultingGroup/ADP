name: ADP Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    env:
      # Disable Keycloak auth in CI — no live Keycloak instance available
      ADP_AUTH_ENABLED: "false"
      # Prevent sentence-transformers from downloading models during tests
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libcairo2-dev \
            libglib2.0-dev \
            gcc \
            pkg-config

      - name: Install package and dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: QG-02 — Schema drift gate
        run: adp-generate --check

      - name: QG-04 / QG-05 — Tests and coverage
        run: python3 -m pytest tests/ --ignore=tests/integration -q

      - name: QG-06 — Linting (ruff)
        run: ruff check src/ tests/

      - name: QG-06 — Type checking (mypy)
        run: mypy src/adp/ --ignore-missing-imports

      - name: QG-06 — Security scan (bandit)
        run: bandit -r src/adp/ -ll

      - name: QG-07 — Dependency CVE scan (pip-audit)
        run: pip-audit --strict
