name: Deploy to Azure

# Builds the API image, runs DB migrations with it, then rolls it out to the
# already-provisioned adp-api Container App (ADP-fnv.6/.10, ADP-0r4). Does NOT
# run Bicep -- infrastructure changes are applied manually via
# infra/azure/deploy.sh; this workflow only moves adp-api and its two jobs
# (adp-migrate, adp-keycloak-admin) to the new image, and runs adp-migrate.
#
# Authenticates via OIDC federated credential (no stored client secret) --
# see the Azure AD app "adp-github-actions-deploy", scoped to only this repo's
# main branch pushes. GitHub's token subject now uses immutable IDs, so the
# credential that matches is "adp-github-main-branch-ids"
# (repo:CampbellConsultingGroup@308136219/ADP@1283167368:ref:refs/heads/main);
# the older name-only "adp-github-main-branch" no longer matches (AADSTS700213).
#
# Its RBAC is minimal and scoped -- no access to Postgres, Key Vault, or
# networking:
#   - AcrPush on adpacr7egbnqct354iu (push/pull images)
#   - Container Registry Tasks Contributor on adpacr7egbnqct354iu -- `az acr
#     build` needs registries/read + scheduleRun; without it the build step
#     fails with "registry could not be found"
#   - Container Apps Contributor on the adp-rg resource group (adp-api)
#   - Container Apps Jobs Contributor on the adp-rg resource group -- the
#     role above covers containerApps only, not jobs; without this the
#     migration step fails with "job 'adp-migrate' does not exist"
# All four are deleted along with adp-rg; infra/azure/deploy.sh re-grants any
# that are missing.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch: {}

# One deploy at a time. Without this, merging several PRs back to back ran
# overlapping deploys that collided (ContainerAppOperationInProgress) or
# superseded each other's revisions mid-smoke-test. Queued, not cancelled:
# GitHub keeps only the newest pending run, so the latest commit deploys last.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: adp-rg
  ACR_NAME: adpacr7egbnqct354iu
  CONTAINER_APP: adp-api

jobs:
  deploy:
    name: Build + Deploy API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build + push image to ACR
        run: |
          # VITE_KEYCLOAK_URL (ADP-cm9): Vite bakes this into the static bundle
          # at build time. Without it, the deployed frontend ships the
          # Dockerfile's local-dev default and real users can never log in --
          # this exact bug shipped once already. Computed from the Container
          # Apps environment's default domain (stable, known before adp-api's
          # own FQDN is), matching infra/azure/apps.bicep's keycloakPublicBaseUrl.
          ENV_DOMAIN=$(az containerapp env show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name adp-env \
            --query "properties.defaultDomain" -o tsv)
          az acr build \
            --registry "${{ env.ACR_NAME }}" \
            --image "adp-api:${{ github.sha }}" \
            --build-arg VITE_KEYCLOAK_URL="https://adp-api.${ENV_DOMAIN}/auth" \
            .

      - name: Container image CVE scan (Trivy)
        # ADP-blp.13: the scanner is pinned (it was :latest) and a fixable CRITICAL
        # vulnerability now stops the deploy. HIGH findings are listed but do not
        # block: the list is short today (see the Dockerfile's upgrade steps) and can
        # be promoted to blocking once it has stayed empty. The image is read from the
        # registry, not through the Docker socket.
        run: |
          TOKEN="$(az acr login --name "${{ env.ACR_NAME }}" --expose-token --query accessToken -o tsv)"
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"
          scan() {
            docker run --rm \
              -e TRIVY_USERNAME=00000000-0000-0000-0000-000000000000 \
              -e TRIVY_PASSWORD="$TOKEN" \
              aquasec/trivy:0.76.2 image --image-src remote --scanners vuln \
              --ignore-unfixed --timeout 15m "$@" "$IMAGE"
          }
          echo "::group::HIGH (report only)"
          scan --severity HIGH --exit-code 0
          echo "::endgroup::"
          scan --severity CRITICAL --exit-code 1

      - name: Run DB migrations (adp-migrate) on the new image
        # ADP-0r4: both jobs run the API image, but only adp-api used to be
        # updated here, so the jobs stayed on whatever image deploy.sh last
        # set and merged Alembic migrations were never applied. Point both
        # jobs at the new image, then migrate BEFORE rolling out adp-api: if
        # a migration fails, the new code never runs against an un-migrated
        # schema (the job fails the workflow and adp-api stays as it was).
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"
          az containerapp job update --name adp-migrate \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --container-name migrate --image "$IMAGE" --output none
          az containerapp job update --name adp-keycloak-admin \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --container-name keycloak-admin --image "$IMAGE" --output none

          EXECUTION=$(az containerapp job start --name adp-migrate \
            --resource-group "${{ env.RESOURCE_GROUP }}" --query name -o tsv)
          echo "Started $EXECUTION"
          # replicaTimeout is 600s (modules/migrationjob.bicep); poll a bit longer.
          for i in $(seq 1 70); do
            STATUS=$(az containerapp job execution show --name adp-migrate \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Succeeded) echo "Migrations applied"; exit 0 ;;
              Failed|Stopped|Degraded)
                echo "Migration $EXECUTION ended $STATUS; adp-api was NOT rolled out."
                echo "Logs: Log Analytics table ContainerAppConsoleLogs_CL, ContainerGroupName_s startswith '$EXECUTION'"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration $EXECUTION did not finish in time; adp-api was NOT rolled out."
          exit 1

      - name: Roll out new image to adp-api
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"

      - name: Smoke test (new revision healthy)
        # adp-api ingress is IP-restricted, so a GitHub runner can't curl
        # /health. Instead, wait for the revision this rollout created to
        # pass its platform health probes and become the ready revision.
        run: |
          REV=$(az containerapp show --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" -o tsv)
          echo "Waiting on revision $REV"
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" --revision "$REV" \
              --query "[properties.healthState, properties.runningState]" -o tsv | tr '\n' ' ')
            READY=$(az containerapp show --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.latestReadyRevisionName" -o tsv)
            echo "Attempt $i: $STATE (latest ready: $READY)"
            case "$STATE" in
              *Failed*|*Degraded*) echo "Revision $REV failed to start"; exit 1 ;;
            esac
            if [ "${STATE%% *}" = "Healthy" ] && [ "$READY" = "$REV" ]; then
              echo "Revision $REV is healthy and ready"
              exit 0
            fi
            sleep 10
          done
          echo "Revision $REV did not become healthy after rollout"
          exit 1
