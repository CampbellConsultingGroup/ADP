name: Deploy to Azure

# Builds the API image and rolls it out to the already-provisioned adp-api
# Container App (ADP-fnv.6/.10). Does NOT run `az deployment sub create` --
# infrastructure changes (Bicep) are applied manually via infra/azure/deploy.sh;
# this workflow only updates the running app's image, matching
# `az acr build` + `az containerapp update`, the same two commands
# deploy.sh itself uses for an app-only rollout.
#
# Authenticates via OIDC federated credential (no stored client secret) --
# see the Azure AD app "adp-github-actions-deploy", scoped to only this repo's
# main branch pushes. GitHub's token subject now uses immutable IDs, so the
# credential that matches is "adp-github-main-branch-ids"
# (repo:CampbellConsultingGroup@308136219/ADP@1283167368:ref:refs/heads/main);
# the older name-only "adp-github-main-branch" no longer matches (AADSTS700213).
#
# Its RBAC is minimal and scoped -- no access to Postgres, Key Vault, or
# networking:
#   - AcrPush on adpacr7egbnqct354iu (push/pull images)
#   - Container Registry Tasks Contributor on adpacr7egbnqct354iu -- `az acr
#     build` needs registries/read + scheduleRun; without it the build step
#     fails with "registry could not be found"
#   - Container Apps Contributor on the adp-rg resource group
# All three are deleted along with adp-rg; re-create them after any
# from-scratch rebuild (RUNBOOK.md, "restore the CD pipeline's role
# assignments").

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch: {}

# One deploy at a time. Without this, merging several PRs back to back ran
# overlapping deploys that collided (ContainerAppOperationInProgress) or
# superseded each other's revisions mid-smoke-test. Queued, not cancelled:
# GitHub keeps only the newest pending run, so the latest commit deploys last.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: adp-rg
  ACR_NAME: adpacr7egbnqct354iu
  CONTAINER_APP: adp-api

jobs:
  deploy:
    name: Build + Deploy API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build + push image to ACR
        run: |
          # VITE_KEYCLOAK_URL (ADP-cm9): Vite bakes this into the static bundle
          # at build time. Without it, the deployed frontend ships the
          # Dockerfile's local-dev default and real users can never log in --
          # this exact bug shipped once already. Computed from the Container
          # Apps environment's default domain (stable, known before adp-api's
          # own FQDN is), matching infra/azure/main.bicep's keycloakPublicBaseUrl.
          ENV_DOMAIN=$(az containerapp env show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name adp-env \
            --query "properties.defaultDomain" -o tsv)
          az acr build \
            --registry "${{ env.ACR_NAME }}" \
            --image "adp-api:${{ github.sha }}" \
            --build-arg VITE_KEYCLOAK_URL="https://adp-api.${ENV_DOMAIN}/auth" \
            .

      - name: Container image CVE scan (Trivy, report-only)
        # ADP-cm9: not yet gating -- expect noise from the third-party
        # keycloak base image and OS packages we don't control on the spot;
        # this is visibility first, blocking later once triaged.
        continue-on-error: true
        run: |
          az acr login --name "${{ env.ACR_NAME }}"
          docker pull "${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            "${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"

      - name: Roll out new image to adp-api
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/adp-api:${{ github.sha }}"

      - name: Smoke test (new revision healthy)
        # adp-api ingress is IP-restricted, so a GitHub runner can't curl
        # /health. Instead, wait for the revision this rollout created to
        # pass its platform health probes and become the ready revision.
        run: |
          REV=$(az containerapp show --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" -o tsv)
          echo "Waiting on revision $REV"
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" --revision "$REV" \
              --query "[properties.healthState, properties.runningState]" -o tsv | tr '\n' ' ')
            READY=$(az containerapp show --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.latestReadyRevisionName" -o tsv)
            echo "Attempt $i: $STATE (latest ready: $READY)"
            case "$STATE" in
              *Failed*|*Degraded*) echo "Revision $REV failed to start"; exit 1 ;;
            esac
            if [ "${STATE%% *}" = "Healthy" ] && [ "$READY" = "$REV" ]; then
              echo "Revision $REV is healthy and ready"
              exit 0
            fi
            sleep 10
          done
          echo "Revision $REV did not become healthy after rollout"
          exit 1
