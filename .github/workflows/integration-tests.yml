name: ADP Integration Tests

# ADP-blp.28: the tests in tests/integration run against a real PostgreSQL (pgvector) container
# started by testcontainers. They ran nowhere before this workflow: the quality-gates run skips
# the folder (--ignore=tests/integration) and a developer machine needs Docker to run them.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Actions are pinned to a commit SHA (ADP-blp.13); the tag is in the trailing comment.
jobs:
  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    env:
      # No live Keycloak instance in CI.
      ADP_AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libcairo2-dev \
            libglib2.0-dev \
            gcc \
            pkg-config

      - name: Install package and dev dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch first: the default wheel pulls several GB of GPU libraries.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Integration tests
        # --no-cov: the coverage threshold belongs to the unit and contract run.
        run: python3 -m pytest tests/integration -q --no-cov -p no:cacheprovider
